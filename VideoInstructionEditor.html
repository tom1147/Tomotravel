            let imageSourceType = scene.imageSource || 'ai';
            if (imageSourceType === 'ai') {
              exportMedia = '✨AIが自動生成';
            } else if (imageSourceType === 'custom') {
              exportMedia = scene.customImagePath || scene.mediaFile || 'ファイル未指定';
            } else if (imageSourceType === 'style') {
              exportMedia = `スタイル背景: ${scene.bgStyle || 'gradient_dark'}`;
            } else {
              exportMedia = 'なし（単色背景）';
            }

            // 改行を配列として保持（動画側で改行そのまま反映）
            const hasExplicitBreaks = exportText && exportText !== "AIにお任せ" && exportText.includes('\n');
            const textLines = hasExplicitBreaks
              ? exportText.split('\n')
              : null;

            return {
              sceneNumber: index + 1,
              text: exportText,
              textLines: textLines,
              preserveLineBreaks: true,
              noText: scene.noText,
              position: scene.position,
              emotion: scene.emotion,
              emotionLabel: { auto: '自動', surprise: '驚き・衝撃', happy: '楽しさ・ポップ', angry: '怒り・強調', sad: '悲しみ・静か', horror: 'ホラー・恐怖', sexy: 'セクシー' }[scene.emotion] || scene.emotion,
              narration: scene.narration,
              duration: 'auto',
              imageSource: imageSourceType,
              bgStyle: imageSourceType === 'style' ? (scene.bgStyle || 'gradient_dark') : undefined,
              media: exportMedia,
              sceneNote: scene.sceneNote || null
            };
          })
        };

        const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `video_instruction_${Date.now()}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      return (
        <div className="min-h-screen bg-gray-50 p-4 md:p-8 font-sans text-gray-800">
          <div className="max-w-4xl mx-auto bg-white p-6 md:p-8 rounded-2xl shadow-xl">
            <h1 className="text-3xl font-extrabold mb-8 text-center bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-purple-600">
              AI動画生成 指示書エディタ
              <span className="text-sm font-normal text-gray-500 block mt-1">Pro Edition - TikTokテンポ対応</span>
            </h1>

            {/* --- 1. 全体設定 --- */}
            <section className="mb-10 bg-blue-50 p-6 rounded-xl border border-blue-100">
              <h2 className="text-xl font-bold mb-6 flex items-center">
                <span className="bg-blue-600 text-white rounded-full w-8 h-8 flex items-center justify-center mr-3 text-sm shrink-0">1</span>
                全体設定
              </h2>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div className="col-span-1 md:col-span-2">
                  <label className="block text-sm font-bold mb-2 text-gray-700">タイトル（テーマ） <span className="text-red-500">*</span></label>
                  <input
                    type="text"
                    value={theme}
                    onChange={(e) => setTheme(e.target.value)}
                    placeholder="例: 高円寺のヤバい歴史 / 30代がやるべき投資..."
                    className="w-full border-2 border-gray-300 rounded-lg p-3 focus:border-blue-500 focus:outline-none transition-colors"
                  />
                </div>

                <div>
                  <label className="block text-sm font-bold mb-2 text-gray-700">動画形式</label>
                  <select value={format} onChange={(e) => setFormat(e.target.value)} className="w-full border-2 border-gray-300 rounded-lg p-3 bg-white">
                    <option value="9:16">📱 9:16 (Shorts/TikTok)</option>
                    <option value="16:9">📺 16:9 (YouTube横動画)</option>
                  </select>
                </div>

                <div>
                  <label className="block text-sm font-bold mb-2 text-gray-700">ターゲット層</label>
                  <select value={target} onChange={(e) => setTarget(e.target.value)} className="w-full border-2 border-gray-300 rounded-lg p-3 bg-white">
                    <option value="all">👥 全年齢層</option>
                    <option value="teens">🎉 10代・Z世代</option>
                    <option value="business">💼 ビジネスパーソン</option>
                    <option value="kids">🧸 子供・ファミリー</option>
                  </select>
                </div>

                <div>
                  <label className="block text-sm font-bold mb-2 text-gray-700">動画のトーン</label>
                  <select value={tone} onChange={(e) => setTone(e.target.value)} className="w-full border-2 border-gray-300 rounded-lg p-3 bg-white">
                    <option value="pop">😄 ポップ・明るい</option>
                    <option value="horror">👻 ホラー・都市伝説</option>
                    <option value="serious">🧐 シリアス・解説</option>
                    <option value="emotional">🥺 エモーショナル・感動</option>
                    <option value="high_tension">🔥 ハイテンション・熱血</option>
                    <option value="sexy">💋 セクシー・大人</option>
                  </select>
                </div>

                <div>
                  <label className="block text-sm font-bold mb-2 text-gray-700">テンポスタイル</label>
                  <select value={tempoStyle} onChange={(e) => setTempoStyle(e.target.value)} className="w-full border-2 border-gray-300 rounded-lg p-3 bg-white">
                    <option value="tiktok">⚡ TikTok超高速テンポ（推奨）</option>
                    <option value="normal">🎬 標準テンポ</option>
                  </select>
                  {tempoStyle === 'tiktok' && (
                    <p className="text-xs text-orange-600 font-bold mt-2">
                      ⚡ 1カット1〜3秒 / ジェットカット / 早口ナレーション / テロップ10文字以内
                    </p>
                  )}
                </div>

                <div>
                  <label className="block text-sm font-bold mb-2 text-gray-700">テキストモード</label>
                  <select value={textMode} onChange={(e) => setTextMode(e.target.value)} className={`w-full border-2 rounded-lg p-3 font-bold ${textMode === 'strict' ? 'border-red-400 bg-red-50 text-red-700' : textMode === 'caption_lock' ? 'border-amber-400 bg-amber-50 text-amber-700' : 'border-gray-300 bg-white text-gray-700'}`}>
                    <option value="arrange">🎨 AIアレンジ（自由）</option>
                    <option value="caption_lock">📌 テロップ固定</option>
                    <option value="strict">🔒 完全固定（テロップ＝読み上げ）</option>
                  </select>
                  <p className="text-xs mt-2" style={{color: textMode === 'strict' ? '#dc2626' : textMode === 'caption_lock' ? '#d97706' : '#6b7280'}}>
                    {textMode === 'arrange' && 'テロップ・ナレーションともにAIが自由にアレンジします'}
                    {textMode === 'caption_lock' && 'テロップは入力テキストそのまま。ナレーションのみAIがアレンジ可'}
                    {textMode === 'strict' && '表示テキスト＝ナレーション。打ち込んだ文字がそのまま表示・読み上げされます'}
                  </p>
                </div>

                <div>
                  <label className="block text-sm font-bold mb-2 text-gray-700">解像度</label>
                  <select value={resolutionQuality} onChange={(e) => setResolutionQuality(e.target.value)} className="w-full border-2 border-gray-300 rounded-lg p-3 bg-white">
                    <option value="standard">📺 標準 ({format === '16:9' ? '1280×720' : '720×1280'})</option>
                    <option value="high">🎬 高画質 ({format === '16:9' ? '1920×1080' : '1080×1920'})</option>
                  </select>
                  <p className="text-xs text-gray-500 mt-2">
                    {resolutionQuality === 'high' ? '⚠️ 高画質: 画像生成に時間がかかる場合があります' : `アスペクト比: ${format}`}
                  </p>
                </div>

                <div>
                  <label className="block text-sm font-bold mb-2 text-gray-700">テロップ表示位置（デフォルト）</label>
                  <select value={defaultPosition} onChange={(e) => setDefaultPosition(e.target.value)} className="w-full border-2 border-gray-300 rounded-lg p-3 bg-white">
                    <option value="auto">✨ 自動（フォーマットに合わせる）</option>
                    <option value="center">中央</option>
                    <option value="bottom">下部</option>
                    <option value="top">上部</option>
                  </select>
                  <p className="text-xs text-gray-500 mt-2">
                    {defaultPosition === 'auto'
                      ? `自動: ${format === '16:9' ? '横動画 → 下部' : 'ショート → 中央'}`
                      : 'シーンごとに個別変更も可能です'}
                  </p>
                </div>

                {/* トグル系 */}
                <div className="space-y-3 bg-white p-4 rounded-lg border border-gray-200">
                  <div className="flex items-center justify-between">
                    <label className="font-bold cursor-pointer flex items-center">
                      <input type="checkbox" checked={voiceEnabled} onChange={(e) => setVoiceEnabled(e.target.checked)} className="mr-3 w-5 h-5 accent-blue-600" />
                      ナレーション (VOICEVOX)
                    </label>
                  </div>

                  {voiceEnabled && (
                    <div className="space-y-2 pl-8">
                      <div className="flex items-center justify-between">
                        <label className="text-sm font-medium text-gray-600 shrink-0 mr-2">キャラ</label>
                        <select value={voiceCharName} onChange={(e) => handleCharChange(e.target.value)} className="border-2 rounded-lg p-2 text-sm flex-1 min-w-0">
                          {Object.entries(speakersByGender).map(([gender, speakers]) => (
                            <optgroup key={gender} label={`── ${gender} ──`}>
                              {speakers.map(s => (
                                <option key={s.name} value={s.name}>{s.name}</option>
                              ))}
                            </optgroup>
                          ))}
                        </select>
                      </div>

                      {currentSpeaker && currentSpeaker.styles.length > 1 && (
                        <div className="flex items-center justify-between">
                          <label className="text-sm font-medium text-gray-600 shrink-0 mr-2">スタイル</label>
                          <select value={voiceSpeakerId} onChange={(e) => setVoiceSpeakerId(Number(e.target.value))} className="border-2 rounded-lg p-2 text-sm flex-1 min-w-0">
                            {currentSpeaker.styles.map(st => (
                              <option key={st.id} value={st.id}>{st.name} (ID:{st.id})</option>
                            ))}
                          </select>
                        </div>
                      )}

                      {currentSpeaker && (
                        <p className="text-xs text-blue-600">
                          {currentSpeaker.gender}・{voiceCharName}{currentStyle ? `（${currentStyle.name}）` : ''} — Speaker ID: {voiceSpeakerId}
                        </p>
                      )}

                      <div className="flex items-center justify-between">
                        <label className="text-sm font-medium text-gray-600 shrink-0 mr-2">話速</label>
                        <select value={voiceSpeed} onChange={(e) => setVoiceSpeed(e.target.value)} className="border-2 rounded-lg p-2 text-sm flex-1 min-w-0">
                          <option value="very_fast">🔥 超早口 (1.4x)</option>
                          <option value="fast">⚡ やや早口 (1.2x) - TikTok推奨</option>
                          <option value="normal">🎙️ 標準 (1.0x)</option>
                        </select>
                      </div>
                    </div>
                  )}

                  <div className="flex items-center justify-between">
                    <label className="font-bold cursor-pointer flex items-center">
                      <input type="checkbox" checked={bgmEnabled} onChange={(e) => setBgmEnabled(e.target.checked)} className="mr-3 w-5 h-5 accent-blue-600" />
                      音楽 (ACE 1.5 Local)
                    </label>
                    {bgmEnabled && (
                      <select value={bgmMood} onChange={(e) => setBgmMood(e.target.value)} className="border-2 rounded-lg p-2 text-sm">
                        <option value="upbeat">🎵 アップテンポ</option>
                        <option value="creepy">😨 不気味・サスペンス</option>
                        <option value="chill">☕️ チル・リラックス</option>
                        <option value="dramatic">🎻 ドラマチック</option>
                        <option value="sexy">💋 セクシー</option>
                      </select>
                    )}
                  </div>

                  <div className="flex items-center justify-between">
                    <label className="font-bold cursor-pointer flex items-center">
                      <input type="checkbox" checked={imageGenEnabled} onChange={(e) => setImageGenEnabled(e.target.checked)} className="mr-3 w-5 h-5 accent-blue-600" />
                      画像生成 (Stable Diffusion)
                    </label>
                    {imageGenEnabled && (
                      <label className={`flex items-center cursor-pointer text-sm font-bold px-3 py-1 rounded-lg border-2 transition-all ${nsfwEnabled ? 'bg-pink-600 text-white border-pink-600' : 'bg-white text-gray-500 border-gray-300 hover:border-pink-300'}`}>
                        <input type="checkbox" checked={nsfwEnabled} onChange={(e) => setNsfwEnabled(e.target.checked)} className="mr-2 w-4 h-4 accent-pink-600" />
                        NSFW
                      </label>
                    )}
                  </div>
                </div>

                <div className="col-span-1 md:col-span-2 mt-2">
                  <label className={`flex items-center font-bold cursor-pointer p-4 rounded-lg border-2 transition-all ${fullAutoMode ? 'bg-indigo-600 text-white border-indigo-600 shadow-md' : 'bg-indigo-50 text-indigo-700 border-indigo-200 hover:bg-indigo-100'}`}>
                    <input type="checkbox" checked={fullAutoMode} onChange={(e) => setFullAutoMode(e.target.checked)} className="mr-4 w-6 h-6" />
                    🚀 完全AIお任せモード (フルオート)
                  </label>
                  <p className="text-xs text-gray-500 mt-2 ml-10">ONにすると、以下のシーン設定をスキップし、テーマのみで一括生成します。</p>
                </div>

                <div className="col-span-1 md:col-span-2 mt-2">
                  <label className="block text-sm font-bold mb-2 text-gray-700">
                    全体備考・指示メモ
                    <span className="text-gray-400 font-normal ml-2 text-xs">（任意）</span>
                  </label>
                  <textarea
                    value={globalNote}
                    onChange={(e) => setGlobalNote(e.target.value)}
                    placeholder="例: 全体的にダークな雰囲気で / ナレーションはゆっくりめに / エンディングにチャンネル登録誘導を入れて / 背景は全シーン統一感を出して..."
                    className="w-full border-2 border-amber-200 rounded-lg p-3 h-20 bg-amber-50 focus:border-amber-400 focus:outline-none transition-colors resize-none text-sm"
                  />
                </div>
              </div>
            </section>

            {/* --- 2. シーンエディタ --- */}
            {!fullAutoMode && (
              <section className="mb-10">
                <h2 className="text-xl font-bold mb-6 flex items-center">
                  <span className="bg-gray-700 text-white rounded-full w-8 h-8 flex items-center justify-center mr-3 text-sm shrink-0">2</span>
                  シーンエディタ
                  {tempoStyle === 'tiktok' && (
                    <span className="ml-3 text-xs bg-orange-100 text-orange-700 px-3 py-1 rounded-full font-bold">
                      ⚡ TikTokモード: 1カット1〜3秒
                    </span>
                  )}
                </h2>
                <div className="space-y-6">
                  {scenes.map((scene, index) => (
                    <div key={scene.id} className="border-2 border-gray-200 rounded-xl p-5 bg-gray-50 hover:shadow-md transition-shadow">
                      <div className="flex justify-between items-center mb-4 pb-3 border-b border-gray-200">
                        <h3 className="font-bold text-lg flex items-center text-gray-700">
                          <span className="bg-gray-300 text-gray-800 rounded px-2 py-1 text-sm mr-3">#{index + 1}</span>
                          シーン設定
                        </h3>
                        <div className="flex items-center gap-3">
                          <span className="border-2 border-green-300 rounded-lg px-3 py-2 text-sm bg-green-50 font-bold text-green-700">
                            ⏱ 自動（音声長で決定）
                          </span>
                          <button
                            onClick={() => removeScene(scene.id)}
                            className="text-red-500 hover:text-white hover:bg-red-500 border border-red-500 rounded px-3 py-1 text-sm font-semibold transition-colors"
                          >
                            削除 ✕
                          </button>
                        </div>
                      </div>

                      <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div className={`col-span-1 md:col-span-2 p-4 rounded-lg border-2 transition-colors ${scene.noText ? 'bg-gray-100 border-gray-300' : 'bg-white border-blue-200'}`}>
                          <div className="flex justify-between items-center mb-3">
                            <label className="text-sm font-bold text-gray-700">
                              表示テキスト
                              {!scene.noText && (
                                <span className="text-orange-500 ml-2 text-xs font-bold">
                                  （{getTextGuide().maxText}文字以内推奨 / 最大{getTextGuide().maxLines}行）
                                </span>
                              )}
                            </label>
                            <label className="flex items-center text-sm cursor-pointer font-medium text-gray-600">
                              <input
                                type="checkbox"
                                checked={scene.noText}
                                onChange={(e) => updateScene(scene.id, 'noText', e.target.checked)}
                                className="mr-2 w-4 h-4"
                              />
                              テキストなし
                            </label>
                          </div>
                          <textarea
                            value={scene.text}
                            onChange={(e) => updateScene(scene.id, 'text', e.target.value)}
                            disabled={scene.noText}
                            placeholder={scene.noText ? "このシーンはテキストが表示されません" : `テロップ文字列（最大${getTextGuide().maxText}文字）短いほどインパクト大！`}
                            className="w-full border-2 border-gray-300 rounded-lg p-3 h-20 focus:border-blue-500 focus:outline-none disabled:bg-gray-200 disabled:text-gray-400 transition-colors resize-none"
                          />
                          {!scene.noText && scene.text.length > getTextGuide().maxText && (
                            <p className="text-xs text-red-500 font-bold mt-1">
                              ⚠️ {scene.text.length}文字 — {format}では{getTextGuide().maxText}文字以内が推奨です
                            </p>
                          )}
                        </div>

                        <div>
                          <label className="block text-sm font-bold mb-2 text-gray-700">感情・演出の方向性</label>
                          <select
                            value={scene.emotion}
                            onChange={(e) => updateScene(scene.id, 'emotion', e.target.value)}
                            className="w-full border-2 border-gray-300 rounded-lg p-3 bg-white disabled:bg-gray-100 disabled:text-gray-400"
                            disabled={scene.noText}
                          >
                            <option value="auto">✨ 自動 (AIにお任せ)</option>
                            <option value="surprise">😲 驚き・衝撃</option>
                            <option value="happy">😄 楽しさ・ポップ</option>
                            <option value="angry">😡 怒り・強調</option>
                            <option value="sad">😢 悲しみ・静か</option>
                            <option value="horror">👻 ホラー・恐怖</option>
                            <option value="sexy">💋 セクシー</option>
                          </select>
                        </div>

                        <div>
                          <label className="block text-sm font-bold mb-2 text-gray-700">表示位置</label>
                          <select
                            value={scene.position}
                            onChange={(e) => updateScene(scene.id, 'position', e.target.value)}
                            className="w-full border-2 border-gray-300 rounded-lg p-3 bg-white disabled:bg-gray-100 disabled:text-gray-400"
                            disabled={scene.noText}
                          >
                            <option value="center">中央 (推奨)</option>
                            <option value="auto">自動</option>
                            <option value="top">上部</option>
                            <option value="bottom">下部 (非推奨)</option>
                          </select>
                        </div>

                        <div className="flex items-center p-3 bg-white rounded-lg border-2 border-gray-200">
                          <label className="flex items-center font-bold cursor-pointer w-full">
                            <input
                              type="checkbox"
                              checked={scene.narration}
                              onChange={(e) => updateScene(scene.id, 'narration', e.target.checked)}
                              className="mr-3 w-5 h-5 accent-blue-600"
                            />
                            このシーンを読み上げる
                          </label>
                        </div>

                        <div className="col-span-1 md:col-span-2">
                          <label className="block text-sm font-bold mb-2 text-gray-700">背景画像ソース</label>
                          <div className="flex flex-wrap gap-2 mb-3">
                            {imageGenEnabled && (
                              <button
                                onClick={() => updateScene(scene.id, 'imageSource', 'ai')}
                                className={`flex-1 min-w-[120px] py-2 px-3 rounded-lg text-sm font-bold border-2 transition-all ${scene.imageSource === 'ai' ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-blue-700 border-blue-200 hover:bg-blue-50'}`}
                              >
                                ✨ AI自動生成
                              </button>
                            )}
                            <button
                              onClick={() => updateScene(scene.id, 'imageSource', 'custom')}
                              className={`flex-1 min-w-[120px] py-2 px-3 rounded-lg text-sm font-bold border-2 transition-all ${scene.imageSource === 'custom' ? 'bg-green-600 text-white border-green-600' : 'bg-white text-green-700 border-green-200 hover:bg-green-50'}`}
                            >
                              🖼️ 自分の画像
                            </button>
                            <button
                              onClick={() => updateScene(scene.id, 'imageSource', 'style')}
                              className={`flex-1 min-w-[120px] py-2 px-3 rounded-lg text-sm font-bold border-2 transition-all ${scene.imageSource === 'style' ? 'bg-purple-600 text-white border-purple-600' : 'bg-white text-purple-700 border-purple-200 hover:bg-purple-50'}`}
                            >
                              🎨 スタイル背景
                            </button>
                            <button
                              onClick={() => updateScene(scene.id, 'imageSource', 'none')}
                              className={`flex-1 min-w-[120px] py-2 px-3 rounded-lg text-sm font-bold border-2 transition-all ${scene.imageSource === 'none' ? 'bg-gray-600 text-white border-gray-600' : 'bg-white text-gray-600 border-gray-200 hover:bg-gray-50'}`}
                            >
                              ⬛ 単色のみ
                            </button>
                          </div>

                          {scene.imageSource === 'custom' && (
                            <div className="space-y-2">
                              <input
                                type="text"
                                value={scene.customImagePath}
                                onChange={(e) => updateScene(scene.id, 'customImagePath', e.target.value)}
                                placeholder="画像ファイルのパスを入力（例: C:\Users\...\image.png）"
                                className="w-full border-2 border-green-300 rounded-lg p-3 bg-green-50 focus:border-green-500 focus:outline-none"
                              />
                              <div className="flex items-center gap-2">
                                <label className="flex items-center justify-center flex-1 h-12 border-2 border-green-300 border-dashed rounded-lg cursor-pointer bg-green-50 hover:bg-green-100 transition-colors">
                                  <span className="font-medium text-green-700 text-sm">{scene.mediaFile ? `📎 ${scene.mediaFile}` : "または ファイルを選択..."}</span>
                                  <input type="file" accept="image/*" className="hidden" onChange={(e) => {
                                    const file = e.target.files[0];
                                    if (file) {
                                      updateScene(scene.id, 'mediaFile', file.name);
                                      updateScene(scene.id, 'customImagePath', file.name);
                                    }
                                  }} />
                                </label>
                              </div>
                            </div>
                          )}

                          {scene.imageSource === 'style' && (
                            <div className="space-y-2">
                              <select
                                value={scene.bgStyle}
                                onChange={(e) => updateScene(scene.id, 'bgStyle', e.target.value)}
                                className="w-full border-2 border-purple-300 rounded-lg p-3 bg-purple-50 font-medium text-purple-800"
                              >
                                <optgroup label="グラデーション">
                                  <option value="gradient_dark">🌑 ダークグラデーション（黒→紫）</option>
                                  <option value="gradient_sunset">🌅 サンセット（オレンジ→ピンク）</option>
                                  <option value="gradient_ocean">🌊 オーシャン（青→シアン）</option>
                                  <option value="gradient_neon">💜 ネオン（ピンク→紫→青）</option>
                                  <option value="gradient_fire">🔥 ファイア（赤→オレンジ→黄）</option>
                                  <option value="gradient_forest">🌲 フォレスト（緑→ダーク）</option>
                                </optgroup>
                                <optgroup label="パターン・テクスチャ">
                                  <option value="pattern_grid">📐 サイバーグリッド</option>
                                  <option value="pattern_particles">✨ パーティクル（キラキラ）</option>
                                  <option value="pattern_smoke">💨 スモーク・霧</option>
                                  <option value="pattern_geometric">🔷 ジオメトリック</option>
                                </optgroup>
                                <optgroup label="感情・テーマ連動">
                                  <option value="mood_danger">⚠️ 危険・警告（赤黒＋点滅）</option>
                                  <option value="mood_exciting">🎉 興奮・盛り上がり（派手グラデ＋光）</option>
                                  <option value="mood_calm">🌙 穏やか・夜（ダークブルー＋星）</option>
                                  <option value="mood_cute">🩷 かわいい・ポップ（ピンク＋ハート）</option>
                                  <option value="mood_serious">📰 シリアス・解説（ダーク＋テクスチャ）</option>
                                </optgroup>
                              </select>
                              <div className="rounded-lg h-16 border-2 border-purple-200 overflow-hidden" style={{
                                background:
                                  scene.bgStyle === 'gradient_dark' ? 'linear-gradient(135deg, #0a0a0a, #1a0033, #2d1b69)' :
                                  scene.bgStyle === 'gradient_sunset' ? 'linear-gradient(135deg, #ff6b35, #f7418c, #fc5c9c)' :
                                  scene.bgStyle === 'gradient_ocean' ? 'linear-gradient(135deg, #0077b6, #00b4d8, #48cae4)' :
                                  scene.bgStyle === 'gradient_neon' ? 'linear-gradient(135deg, #ff006e, #8338ec, #3a86ff)' :
                                  scene.bgStyle === 'gradient_fire' ? 'linear-gradient(135deg, #dc2f02, #e85d04, #ffba08)' :
                                  scene.bgStyle === 'gradient_forest' ? 'linear-gradient(135deg, #2d6a4f, #40916c, #1b4332)' :
                                  scene.bgStyle === 'pattern_grid' ? 'linear-gradient(135deg, #0a0a2e, #1a1a4e)' :
                                  scene.bgStyle === 'pattern_particles' ? 'linear-gradient(135deg, #0f0c29, #302b63, #24243e)' :
                                  scene.bgStyle === 'pattern_smoke' ? 'linear-gradient(135deg, #2c3e50, #4a6741, #2c3e50)' :
                                  scene.bgStyle === 'pattern_geometric' ? 'linear-gradient(135deg, #141e30, #243b55)' :
                                  scene.bgStyle === 'mood_danger' ? 'linear-gradient(135deg, #1a0000, #8b0000, #1a0000)' :
                                  scene.bgStyle === 'mood_exciting' ? 'linear-gradient(135deg, #ff0844, #ffb199, #ff0844)' :
                                  scene.bgStyle === 'mood_calm' ? 'linear-gradient(135deg, #0c1445, #1a237e, #0d1b3e)' :
                                  scene.bgStyle === 'mood_cute' ? 'linear-gradient(135deg, #ff9a9e, #fecfef, #ffdde1)' :
                                  scene.bgStyle === 'mood_serious' ? 'linear-gradient(135deg, #1a1a2e, #2d2d44, #16213e)' :
                                  '#000'
                              }}>
                                <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100%',color:'white',fontSize:12,fontWeight:'bold',textShadow:'0 1px 4px rgba(0,0,0,0.8)'}}>プレビュー</div>
                              </div>
                              <p className="text-xs text-purple-600">画像なしでテキストの雰囲気に合った背景スタイルを適用します</p>
                            </div>
                          )}

                          {scene.imageSource === 'ai' && (
                            <p className="text-xs text-blue-600 mt-1">Stable Diffusionが自動でシーンに合った画像を生成します</p>
                          )}
                          {scene.imageSource === 'none' && (
                            <p className="text-xs text-gray-500 mt-1">単色黒背景のみで表示されます</p>
                          )}
                        </div>

                        {/* 備考・シーン指示メモ */}
                        <div className="col-span-1 md:col-span-2">
                          <label className="block text-sm font-bold mb-2 text-gray-700">
                            備考・指示メモ
                            <span className="text-gray-400 font-normal ml-2 text-xs">（任意）</span>
                          </label>
                          <textarea
                            value={scene.sceneNote}
                            onChange={(e) => updateScene(scene.id, 'sceneNote', e.target.value)}
                            placeholder="例: このシーンだけテンポをゆっくりに / 背景を暗めに / SEを入れたい / ナレーションに間を持たせる..."
                            className="w-full border-2 border-amber-200 rounded-lg p-3 h-16 bg-amber-50 focus:border-amber-400 focus:outline-none transition-colors resize-none text-sm"
                          />
                        </div>
                      </div>
                    </div>
                  ))}

                  <button
                    onClick={addScene}
                    className="w-full border-2 border-dashed border-gray-300 text-gray-600 font-bold py-4 rounded-xl hover:bg-gray-100 hover:border-gray-400 transition-all flex items-center justify-center"
                  >
                    <span className="text-2xl mr-2">+</span> シーンを追加する
                  </button>
                </div>
              </section>
            )}

            {/* --- 3. エクスポート --- */}
            <section className="text-center mt-12 pb-8">
              <button
                onClick={handleExport}
                className="bg-gradient-to-r from-blue-600 to-indigo-700 text-white font-extrabold py-5 px-16 rounded-full shadow-xl hover:shadow-2xl hover:from-blue-700 hover:to-indigo-800 transform hover:scale-105 transition-all text-xl inline-flex items-center justify-center"
              >
                <span className="mr-3">⚡️</span> AIへ指示を出す (JSON保存)
              </button>
              <p className="text-gray-500 mt-4 text-sm">設定に基づいた詳細なプロンプトを含むJSONファイルがダウンロードされます。</p>
            </section>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
