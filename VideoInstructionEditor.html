                    <label className={`flex items-center font-bold cursor-pointer p-3 rounded-lg border-2 transition-all ${nekoMode ? 'bg-orange-500 text-white border-orange-600 shadow-sm' : 'bg-white text-orange-700 border-orange-300 hover:bg-orange-100'}`}>
                      <input type="checkbox" checked={nekoMode} onChange={(e) => handleNekoModeChange(e.target.checked)} className="mr-3 w-5 h-5 accent-orange-700" />
                      🐈 猫キャラ（ニャースちゃんねる）モード
                      <span className="ml-2 text-xs font-normal">（語尾に「〜にゃ」を付け、元気な猫として解説します）</span>
                    </label>

                    <div className="bg-white p-3 rounded-lg border border-orange-200">
                      <div className="flex items-center justify-between mb-2">
                        <label className="font-bold cursor-pointer flex items-center text-gray-700">
                          <input type="checkbox" checked={opEnabled} onChange={(e) => setOpEnabled(e.target.checked)} className="mr-3 w-4 h-4 accent-blue-600" />
                          🎬 オープニング定型文を第1シーンに挿入
                        </label>
                      </div>
                      {opEnabled && (
                        <textarea
                          value={opText}
                          onChange={(e) => setOpText(e.target.value)}
                          className="w-full border-2 border-gray-300 rounded-lg p-2 text-sm focus:border-blue-500 focus:outline-none"
                          rows="2"
                        />
                      )}
                    </div>

                    <div className="bg-white p-3 rounded-lg border border-orange-200">
                      <div className="flex items-center justify-between mb-2">
                        <label className="font-bold cursor-pointer flex items-center text-gray-700">
                          <input type="checkbox" checked={edEnabled} onChange={(e) => setEdEnabled(e.target.checked)} className="mr-3 w-4 h-4 accent-blue-600" />
                          🏁 エンディング定型文を最終シーンに挿入
                        </label>
                      </div>
                      {edEnabled && (
                        <textarea
                          value={edText}
                          onChange={(e) => setEdText(e.target.value)}
                          className="w-full border-2 border-gray-300 rounded-lg p-2 text-sm focus:border-blue-500 focus:outline-none"
                          rows="2"
                        />
                      )}
                    </div>
                  </div>
                </div>

                <div className="col-span-1 md:col-span-2 mt-2">
                  <label className={`flex items-center font-bold cursor-pointer p-4 rounded-lg border-2 transition-all ${fullAutoMode ? 'bg-indigo-600 text-white border-indigo-600 shadow-md' : 'bg-indigo-50 text-indigo-700 border-indigo-200 hover:bg-indigo-100'}`}>
                    <input type="checkbox" checked={fullAutoMode} onChange={(e) => setFullAutoMode(e.target.checked)} className="mr-4 w-6 h-6" />
                    🚀 完全AIお任せモード (フルオート)
                  </label>
                  <p className="text-xs text-gray-500 mt-2 ml-10">ONにすると、以下のシーン設定をスキップし、テーマのみで一括生成します。</p>
                </div>

                {format === '16:9' && (
                  <div className="col-span-1 md:col-span-2 mt-2">
                    <label className={`flex items-center font-bold cursor-pointer p-4 rounded-lg border-2 transition-all ${advStyleCaption ? 'bg-amber-600 text-white border-amber-600 shadow-md' : 'bg-amber-50 text-amber-800 border-amber-200 hover:bg-amber-100'}`}>
                      <input type="checkbox" checked={advStyleCaption} onChange={(e) => setAdvStyleCaption(e.target.checked)} className="mr-4 w-6 h-6" />
                      🎮 アドベンチャーゲーム風 解説テロップモード (16:9専用)
                    </label>
                    <p className="text-xs text-gray-500 mt-2 ml-10">ONにすると、画面下部に背景が透ける半透明の黒帯（メッセージウィンドウ）を配置し、テキストがはみ出ないよう視認性良く表示するようAIに指示を出します。</p>
                  </div>
                )}

                <div className="col-span-1 md:col-span-2 mt-2">
                  <label className="block text-sm font-bold mb-2 text-gray-700">
                    全体備考・指示メモ
                    <span className="text-gray-400 font-normal ml-2 text-xs">（任意）</span>
                  </label>
                  <textarea
                    value={globalNote}
                    onChange={(e) => setGlobalNote(e.target.value)}
                    placeholder="例: 全体的にダークな雰囲気で / ナレーションはゆっくりめに / エンディングにチャンネル登録誘導を入れて / 背景は全シーン統一感を出して..."
                    className="w-full border-2 border-amber-200 rounded-lg p-3 h-20 bg-amber-50 focus:border-amber-400 focus:outline-none transition-colors resize-none text-sm"
                  />
                </div>
              </div>
            </section>

            {/* --- 2. シーンエディタ --- */}
            {!fullAutoMode && (
              <section className="mb-10">
                <div className="flex justify-between items-end mb-6">
                  <h2 className="text-xl font-bold flex items-center">
                    <span className="bg-gray-700 text-white rounded-full w-8 h-8 flex items-center justify-center mr-3 text-sm shrink-0">2</span>
                    シーンエディタ
                    {tempoStyle === 'tiktok' && (
                      <span className="ml-3 text-xs bg-orange-100 text-orange-700 px-3 py-1 rounded-full font-bold">
                        ⚡ TikTokモード: 1カット1〜3秒
                      </span>
                    )}
                  </h2>
                  <div className="flex gap-3">
                    <button
                      onClick={() => setShowJsonToTsvModal(true)}
                      className="bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold py-2 px-4 rounded-lg flex items-center shadow-sm transition-colors"
                    >
                      🔄 AI生成JSON → TSV変換
                    </button>
                    <button
                      onClick={() => setShowImportModal(true)}
                      className="bg-green-600 hover:bg-green-700 text-white text-sm font-bold py-2 px-4 rounded-lg flex items-center shadow-sm transition-colors"
                    >
                      📋 スプレッドシートから一括作成
                    </button>
                  </div>
                </div>

                {/* JSON → TSV変換用モーダル */}
                {showJsonToTsvModal && (
                  <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                    <div className="bg-white rounded-xl shadow-2xl p-6 w-full max-w-4xl max-h-[90vh] overflow-y-auto">
                      <div className="flex justify-between items-center mb-4 border-b pb-2">
                        <h3 className="text-lg font-bold text-gray-800">🔄 AI生成JSON → スプレッドシート(TSV) 変換</h3>
                        <button onClick={() => { setShowJsonToTsvModal(false); setJsonInput(''); setTsvOutput(''); }} className="text-gray-500 hover:text-gray-700 font-bold text-xl">×</button>
                      </div>
                      
                      <div className="space-y-4 text-sm text-gray-600 bg-blue-50 p-4 rounded-lg border border-blue-100 mb-4">
                        <p className="font-bold text-blue-800">💡 使い方</p>
                        <p>
                          AI（ChatGPT等）が考えて出力してくれた**「台本データのJSONファイル（またはテキスト）」**を入力してください。<br/>
                          自動でスプレッドシート用の表（TSV）に変換されます。
                        </p>
                      </div>

                      <div className="mb-4">
                        <label className="flex items-center justify-center w-full h-16 border-2 border-blue-300 border-dashed rounded-lg cursor-pointer bg-blue-50 hover:bg-blue-100 transition-colors">
                          <span className="font-bold text-blue-700">📁 JSONファイルをアップロードして変換する</span>
                          <input type="file" accept=".json" className="hidden" onChange={handleJsonFileUpload} />
                        </label>
                      </div>

                      <div className="flex items-center justify-center mb-4">
                        <span className="text-gray-400 font-bold">—— またはテキストを直接貼り付け ——</span>
                      </div>

                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                          <label className="block text-sm font-bold text-gray-700 mb-2">1. AIが出力したJSONを貼り付け</label>
                          <textarea
                            value={jsonInput}
                            onChange={(e) => setJsonInput(e.target.value)}
                            placeholder='[ { "id": "scene_01", "text": "...", "captions": [...] } ]'
                            className="w-full h-48 border-2 border-gray-300 rounded-lg p-3 font-mono text-xs focus:border-blue-500 focus:outline-none"
                          />
                          <button
                            onClick={() => handleJsonToTsvConvert()}
                            className="mt-3 w-full px-4 py-2 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 shadow-md transition-colors"
                          >
                            テキストからTSVに変換 ➔
                          </button>
                        </div>
                        <div>
                          <label className="block text-sm font-bold text-gray-700 mb-2">2. 変換結果 (スプレッドシートにコピペ)</label>
                          <textarea
                            value={tsvOutput}
                            readOnly
                            placeholder="ここに変換されたTSVデータが表示されます"
                            className="w-full h-48 border-2 border-green-300 rounded-lg p-3 font-mono text-xs bg-green-50 focus:outline-none"
                          />
                          <button
                            onClick={() => { navigator.clipboard.writeText(tsvOutput); alert('クリップボードにコピーしました！\nスプレッドシートに貼り付けてください。'); }}
                            className="mt-3 w-full px-4 py-2 bg-green-600 text-white font-bold rounded-lg hover:bg-green-700 shadow-md transition-colors disabled:bg-gray-400 disabled:cursor-not-allowed"
                            disabled={!tsvOutput}
                          >
                            📋 クリップボードにコピー
                          </button>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* インポート用モーダル */}
                {showImportModal && (
                  <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                    <div className="bg-white rounded-xl shadow-2xl p-6 w-full max-w-2xl max-h-[90vh] overflow-y-auto">
                      <div className="flex justify-between items-center mb-4 border-b pb-2">
                        <h3 className="text-lg font-bold text-gray-800">📋 スプレッドシート読み込み (TSV)</h3>
                        <button onClick={() => setShowImportModal(false)} className="text-gray-500 hover:text-gray-700 font-bold text-xl">×</button>
                      </div>
                      <div className="space-y-4">
                        <p className="text-sm text-gray-600">
                          ExcelやGoogleスプレッドシートの表をコピーして、ここに貼り付けてください。<br/>
                          <span className="text-xs text-gray-400">※1行目はヘッダーとして扱われます。2列目:テロップ、3列目:読み上げ、4列目:備考として認識します。</span>
                        </p>
                        <textarea
                          value={importText}
                          onChange={(e) => setImportText(e.target.value)}
                          placeholder={`シーン\tテロップ(表示)\t読み上げ(音声)\t備考・指示メモ\n1\tこれマジ！？\tえ、マジ！？\t0.5秒で\n2\t...`}
                          className="w-full h-64 border-2 border-gray-300 rounded-lg p-3 font-mono text-xs focus:border-green-500 focus:outline-none"
                        />
                        <div className="flex justify-end gap-3 pt-2">
                          <button
                            onClick={() => setShowImportModal(false)}
                            className="px-4 py-2 text-gray-600 font-bold hover:bg-gray-100 rounded-lg"
                          >
                            キャンセル
                          </button>
                          <button
                            onClick={handleSpreadsheetImport}
                            className="px-6 py-2 bg-green-600 text-white font-bold rounded-lg hover:bg-green-700 shadow-md"
                          >
                            読み込んで作成
                          </button>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                <div className="space-y-6">
                  {scenes.map((scene, index) => {
                    const currentSceneSpeaker = VOICEVOX_SPEAKERS.find(s => s.name === scene.voiceCharName);
                    return (
                    <div key={scene.id} className="border-2 border-gray-200 rounded-xl p-5 bg-gray-50 hover:shadow-md transition-shadow">
                      <div className="flex justify-between items-center mb-4 pb-3 border-b border-gray-200">
                        <h3 className="font-bold text-lg flex items-center text-gray-700">
                          <span className="bg-gray-300 text-gray-800 rounded px-2 py-1 text-sm mr-3">#{index + 1}</span>
                          シーン設定
                        </h3>
                        <div className="flex items-center gap-3">
                          <span className="border-2 border-green-300 rounded-lg px-3 py-2 text-sm bg-green-50 font-bold text-green-700">
                            ⏱ 自動（音声長で決定）
                          </span>
                          <button
                            onClick={() => removeScene(scene.id)}
                            className="text-red-500 hover:text-white hover:bg-red-500 border border-red-500 rounded px-3 py-1 text-sm font-semibold transition-colors"
                          >
                            削除 ✕
                          </button>
                        </div>
                      </div>

                      <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div className={`col-span-1 md:col-span-2 p-4 rounded-lg border-2 transition-colors ${scene.noText ? 'bg-gray-100 border-gray-300' : 'bg-white border-blue-200'}`}>
                          <div className="flex justify-between items-center mb-3">
                            <label className="text-sm font-bold text-gray-700">
                              表示テキスト（テロップ）
                              {!scene.noText && (
                                <span className="text-orange-500 ml-2 text-xs font-bold">
                                  （{getTextGuide().maxText}文字以内推奨 / 最大{getTextGuide().maxLines}行）
                                </span>
                              )}
                            </label>
                            <label className="flex items-center text-sm cursor-pointer font-medium text-gray-600">
                              <input
                                type="checkbox"
                                checked={scene.noText}
                                onChange={(e) => updateScene(scene.id, 'noText', e.target.checked)}
                                className="mr-2 w-4 h-4"
                              />
                              テキストなし
                            </label>
                          </div>
                          <textarea
                            value={scene.text}
                            onChange={(e) => updateScene(scene.id, 'text', e.target.value)}
                            disabled={scene.noText}
                            placeholder={scene.noText ? "このシーンはテキストが表示されません" : `テロップ文字列（最大${getTextGuide().maxText}文字）短いほどインパクト大！`}
                            className="w-full border-2 border-gray-300 rounded-lg p-3 h-20 focus:border-blue-500 focus:outline-none disabled:bg-gray-200 disabled:text-gray-400 transition-colors resize-none"
                          />
                          {!scene.noText && scene.text.length > getTextGuide().maxText && (
                            <p className="text-xs text-red-500 font-bold mt-1">
                              ⚠️ {scene.text.length}文字 — {format}では{getTextGuide().maxText}文字以内が推奨です
                            </p>
                          )}

                          {textMode === 'manual' && (
                            <div className="mt-3 border-t border-gray-200 pt-3">
                              <label className="block text-sm font-bold text-purple-700 mb-1">
                                読み上げテキスト（ナレーション）
                                <span className="text-xs font-normal text-purple-500 ml-2">※空欄の場合はナレーションなし</span>
                              </label>
                              <textarea
                                value={scene.readText}
                                onChange={(e) => updateScene(scene.id, 'readText', e.target.value)}
                                placeholder="読み上げ内容を入力（空欄の場合は無音）"
                                className="w-full border-2 border-purple-300 rounded-lg p-3 h-20 bg-purple-50 focus:border-purple-500 focus:outline-none transition-colors resize-none"
                              />
                            </div>
                          )}
                        </div>

                        <div>
                          <label className="block text-sm font-bold mb-2 text-gray-700">感情・演出の方向性</label>
                          <select
                            value={scene.emotion}
                            onChange={(e) => updateScene(scene.id, 'emotion', e.target.value)}
                            className="w-full border-2 border-gray-300 rounded-lg p-3 bg-white disabled:bg-gray-100 disabled:text-gray-400"
                            disabled={scene.noText}
                          >
                            <option value="auto">✨ 自動 (AIにお任せ)</option>
                            <option value="surprise">😲 驚き・衝撃</option>
                            <option value="happy">😄 楽しさ・ポップ</option>
                            <option value="angry">😡 怒り・強調</option>
                            <option value="sad">😢 悲しみ・静か</option>
                            <option value="horror">👻 ホラー・恐怖</option>
                            <option value="sexy">💋 セクシー</option>
                          </select>
                        </div>

                        <div>
                          <label className="block text-sm font-bold mb-2 text-gray-700">表示位置</label>
                          <select
                            value={scene.position}
                            onChange={(e) => updateScene(scene.id, 'position', e.target.value)}
                            className="w-full border-2 border-gray-300 rounded-lg p-3 bg-white disabled:bg-gray-100 disabled:text-gray-400"
                            disabled={scene.noText}
                          >
                            <option value="center">中央 (推奨)</option>
                            <option value="auto">自動</option>
                            <option value="top">上部</option>
                            <option value="bottom">下部 (非推奨)</option>
                          </select>
                        </div>

                        <div className="flex items-center p-3 bg-white rounded-lg border-2 border-gray-200">
                          <label className="flex items-center font-bold cursor-pointer w-full">
                            <input
                              type="checkbox"
                              checked={scene.narration}
                              onChange={(e) => updateScene(scene.id, 'narration', e.target.checked)}
                              className="mr-3 w-5 h-5 accent-blue-600"
                              disabled={textMode === 'manual'} 
                            />
                            <span className={textMode === 'manual' ? "text-gray-400" : ""}>
                              このシーンを読み上げる
                              {textMode === 'manual' && <span className="text-xs ml-2 font-normal">(手動モードでは入力内容で判定)</span>}
                            </span>
                          </label>
                        </div>

                        {/* --- シーン個別ボイス設定UI --- */}
                        <div className="col-span-1 md:col-span-2">
                          <div className={`mt-1 p-3 rounded-lg border-2 transition-colors ${scene.voiceOverride ? 'bg-indigo-50 border-indigo-300' : 'bg-white border-gray-200'}`}>
                            <label className="flex items-center text-sm font-bold cursor-pointer mb-2">
                              <input
                                type="checkbox"
                                checked={scene.voiceOverride || false}
                                onChange={(e) => updateScene(scene.id, 'voiceOverride', e.target.checked)}
                                className="mr-2 w-4 h-4 accent-indigo-600"
                              />
                              <span className={scene.voiceOverride ? "text-indigo-700" : "text-gray-500"}>
                                🗣️ このシーンの話者を変更する（掛け合い用）
                              </span>
                            </label>
                            
                            {scene.voiceOverride && (
                              <div className="grid grid-cols-1 md:grid-cols-3 gap-2 mt-2 pl-4 border-l-4 border-indigo-200">
                                <div>
                                  <label className="text-xs font-bold text-gray-500">キャラクター</label>
                                  <select 
                                    value={scene.voiceCharName} 
                                    onChange={(e) => handleSceneCharChange(scene.id, e.target.value)}
                                    className="w-full border rounded p-1 text-sm"
                                  >
                                    {Object.entries(speakersByGender).map(([gender, speakers]) => (
                                      <optgroup key={gender} label={`── ${gender} ──`}>
                                        {speakers.map(s => (
                                          <option key={s.name} value={s.name}>{s.name}</option>
                                        ))}
                                      </optgroup>
                                    ))}
                                  </select>
                                </div>
                                <div>
                                  <label className="text-xs font-bold text-gray-500">スタイル</label>
                                  <select 
                                    value={scene.voiceSpeakerId} 
                                    onChange={(e) => updateScene(scene.id, 'voiceSpeakerId', Number(e.target.value))}
                                    className="w-full border rounded p-1 text-sm"
                                  >
                                    {currentSceneSpeaker?.styles.map(st => (
                                      <option key={st.id} value={st.id}>{st.name} (ID:{st.id})</option>
                                    ))}
                                  </select>
                                </div>
                                <div>
                                  <label className="text-xs font-bold text-gray-500">速度</label>
                                  <select 
                                    value={scene.voiceSpeed} 
                                    onChange={(e) => updateScene(scene.id, 'voiceSpeed', e.target.value)}
                                    className="w-full border rounded p-1 text-sm"
                                  >
                                    <option value="very_fast">🔥 超早口 (1.4x)</option>
                                    <option value="fast">⚡ やや早口 (1.2x)</option>
                                    <option value="normal">🎙️ 標準 (1.0x)</option>
                                  </select>
                                </div>
                              </div>
                            )}
                          </div>
                        </div>

                        {/* --- 立ち絵個別設定UI --- */}
                        <div className="col-span-1 md:col-span-2">
                          <div className={`mt-1 p-3 rounded-lg border-2 transition-colors ${scene.tachieOverride ? 'bg-pink-50 border-pink-300' : 'bg-white border-gray-200'}`}>
                            <label className="flex items-center text-sm font-bold cursor-pointer mb-2">
                              <input
                                type="checkbox"
                                checked={scene.tachieOverride || false}
                                onChange={(e) => updateScene(scene.id, 'tachieOverride', e.target.checked)}
                                className="mr-2 w-4 h-4 accent-pink-600"
                              />
                              <span className={scene.tachieOverride ? "text-pink-700" : "text-gray-500"}>
                                🐈 このシーンの「立ち絵」を個別設定する
                              </span>
                            </label>
                            
                            {scene.tachieOverride && (
                              <div className="mt-2 pl-4 border-l-4 border-pink-200">
                                <label className="flex items-center text-sm font-bold cursor-pointer">
                                  <input
                                    type="checkbox"
                                    checked={scene.sceneTachieEnabled !== false}
                                    onChange={(e) => updateScene(scene.id, 'sceneTachieEnabled', e.target.checked)}
                                    className="mr-2 w-4 h-4 accent-pink-600"
                                  />
                                  <span className={scene.sceneTachieEnabled !== false ? "text-pink-700" : "text-gray-400 line-through"}>
                                    立ち絵を表示する
                                  </span>
                                </label>
                                <p className="text-xs text-gray-500 mt-1">チェックを外すとこのシーンのみ立ち絵が消えます</p>
                              </div>
                            )}
                          </div>
                        </div>

                        <div className="col-span-1 md:col-span-2">
                          <label className="block text-sm font-bold mb-2 text-gray-700">背景画像ソース</label>
                          <div className="flex flex-wrap gap-2 mb-3">
                            {imageGenEnabled && (
                              <button
                                onClick={() => updateScene(scene.id, 'imageSource', 'ai')}
                                className={`flex-1 min-w-[120px] py-2 px-3 rounded-lg text-sm font-bold border-2 transition-all ${scene.imageSource === 'ai' ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-blue-700 border-blue-200 hover:bg-blue-50'}`}
                              >
                                ✨ AI自動生成
                              </button>
                            )}
                            <button
                              onClick={() => updateScene(scene.id, 'imageSource', 'custom')}
                              className={`flex-1 min-w-[120px] py-2 px-3 rounded-lg text-sm font-bold border-2 transition-all ${scene.imageSource === 'custom' ? 'bg-green-600 text-white border-green-600' : 'bg-white text-green-700 border-green-200 hover:bg-green-50'}`}
                            >
                              🖼️ 自分の画像
                            </button>
                            <button
                              onClick={() => updateScene(scene.id, 'imageSource', 'style')}
                              className={`flex-1 min-w-[120px] py-2 px-3 rounded-lg text-sm font-bold border-2 transition-all ${scene.imageSource === 'style' ? 'bg-purple-600 text-white border-purple-600' : 'bg-white text-purple-700 border-purple-200 hover:bg-purple-50'}`}
                            >
                              🎨 スタイル背景
                            </button>
                            <button
                              onClick={() => updateScene(scene.id, 'imageSource', 'none')}
                              className={`flex-1 min-w-[120px] py-2 px-3 rounded-lg text-sm font-bold border-2 transition-all ${scene.imageSource === 'none' ? 'bg-gray-600 text-white border-gray-600' : 'bg-white text-gray-600 border-gray-200 hover:bg-gray-50'}`}
                            >
                              ⬛ 単色のみ
                            </button>
                          </div>

                          {scene.imageSource === 'custom' && (
                            <div className="space-y-4">
                              <div className="bg-green-50 p-3 rounded-lg border border-green-200">
                                <label className="block text-xs font-bold text-green-800 mb-2">📁 PCのローカル画像を指定</label>
                                <input
                                  type="text"
                                  value={scene.customImagePath}
                                  onChange={(e) => updateScene(scene.id, 'customImagePath', e.target.value)}
                                  placeholder="画像ファイルのパスを入力（例: C:\Users\...\image.png）"
                                  className="w-full border-2 border-green-300 rounded-lg p-2 bg-white focus:border-green-500 focus:outline-none mb-2 text-sm"
                                />
                                <div className="flex items-center gap-2">
                                  <label className="flex items-center justify-center w-full h-10 border-2 border-green-300 border-dashed rounded-lg cursor-pointer bg-white hover:bg-green-100 transition-colors">
                                    <span className="font-medium text-green-700 text-sm">{scene.mediaFile ? `📎 ${scene.mediaFile}` : "または ファイルを選択..."}</span>
                                    <input type="file" accept="image/*" className="hidden" onChange={(e) => {
                                      const file = e.target.files[0];
                                      if (file) {
                                        updateScene(scene.id, 'mediaFile', file.name);
                                        updateScene(scene.id, 'customImagePath', file.name);
                                      }
                                    }} />
                                  </label>
                                </div>
                              </div>

                              <div className="bg-blue-50 p-3 rounded-lg border border-blue-200">
                                <label className="block text-xs font-bold text-blue-800 mb-2">☁️ Googleドライブから選択（API経由）</label>
                                
                                <select
                                  value={scene.customImagePath.includes(driveBasePath.replace(/\\$/, '')) ? scene.customImagePath.split('\\').pop() : ""}
                                  onChange={(e) => {
                                    const selectedName = e.target.value;
                                    if (!selectedName) {
                                      updateScene(scene.id, 'customImagePath', '');
                                      updateScene(scene.id, 'mediaFile', '');
                                      return;
                                    }
                                    const base = driveBasePath.replace(/\\$/, '');
                                    const fullPath = `${base}\\${selectedName}`;
                                    updateScene(scene.id, 'customImagePath', fullPath);
                                    updateScene(scene.id, 'mediaFile', selectedName);
                                  }}
                                  className="w-full border-2 border-blue-300 rounded-lg p-2 bg-white font-bold text-blue-800 focus:border-blue-500 focus:outline-none text-sm"
                                >
                                  <option value="">画像を選択してください...</option>
                                  {driveImages.map(img => (
                                    <option key={img.id} value={img.name}>{img.name}</option>
                                  ))}
                                </select>
                                {driveImagesError && (
                                  <p className="text-xs text-red-500 font-bold mt-1">取得エラー: {driveImagesError}</p>
                                )}
                              </div>
                            </div>
                          )}

                          {scene.imageSource === 'style' && (
                            <div className="space-y-2">
                              <select
                                value={scene.bgStyle}
                                onChange={(e) => updateScene(scene.id, 'bgStyle', e.target.value)}
                                className="w-full border-2 border-purple-300 rounded-lg p-3 bg-purple-50 font-medium text-purple-800"
                              >
                                <optgroup label="グラデーション">
                                  <option value="gradient_dark">🌑 ダークグラデーション（黒→紫）</option>
                                  <option value="gradient_sunset">🌅 サンセット（オレンジ→ピンク）</option>
                                  <option value="gradient_ocean">🌊 オーシャン（青→シアン）</option>
                                  <option value="gradient_neon">💜 ネオン（ピンク→紫→青）</option>
                                  <option value="gradient_fire">🔥 ファイア（赤→オレンジ→黄）</option>
                                  <option value="gradient_forest">🌲 フォレスト（緑→ダーク）</option>
                                </optgroup>
                                <optgroup label="パターン・テクスチャ">
                                  <option value="pattern_grid">📐 サイバーグリッド</option>
                                  <option value="pattern_particles">✨ パーティクル（キラキラ）</option>
                                  <option value="pattern_smoke">💨 スモーク・霧</option>
                                  <option value="pattern_geometric">🔷 ジオメトリック</option>
                                </optgroup>
                                <optgroup label="感情・テーマ連動">
                                  <option value="mood_danger">⚠️ 危険・警告（赤黒＋点滅）</option>
                                  <option value="mood_exciting">🎉 興奮・盛り上がり（派手グラデ＋光）</option>
                                  <option value="mood_calm">🌙 穏やか・夜（ダークブルー＋星）</option>
                                  <option value="mood_cute">🩷 かわいい・ポップ（ピンク＋ハート）</option>
                                  <option value="mood_serious">📰 シリアス・解説（ダーク＋テクスチャ）</option>
                                </optgroup>
                              </select>
                              <div className="rounded-lg h-16 border-2 border-purple-200 overflow-hidden" style={{
                                background:
                                  scene.bgStyle === 'gradient_dark' ? 'linear-gradient(135deg, #0a0a0a, #1a0033, #2d1b69)' :
                                  scene.bgStyle === 'gradient_sunset' ? 'linear-gradient(135deg, #ff6b35, #f7418c, #fc5c9c)' :
                                  scene.bgStyle === 'gradient_ocean' ? 'linear-gradient(135deg, #0077b6, #00b4d8, #48cae4)' :
                                  scene.bgStyle === 'gradient_neon' ? 'linear-gradient(135deg, #ff006e, #8338ec, #3a86ff)' :
                                  scene.bgStyle === 'gradient_fire' ? 'linear-gradient(135deg, #dc2f02, #e85d04, #ffba08)' :
                                  scene.bgStyle === 'gradient_forest' ? 'linear-gradient(135deg, #2d6a4f, #40916c, #1b4332)' :
                                  scene.bgStyle === 'pattern_grid' ? 'linear-gradient(135deg, #0a0a2e, #1a1a4e)' :
                                  scene.bgStyle === 'pattern_particles' ? 'linear-gradient(135deg, #0f0c29, #302b63, #24243e)' :
                                  scene.bgStyle === 'pattern_smoke' ? 'linear-gradient(135deg, #2c3e50, #4a6741, #2c3e50)' :
                                  scene.bgStyle === 'pattern_geometric' ? 'linear-gradient(135deg, #141e30, #243b55)' :
                                  scene.bgStyle === 'mood_danger' ? 'linear-gradient(135deg, #1a0000, #8b0000, #1a0000)' :
                                  scene.bgStyle === 'mood_exciting' ? 'linear-gradient(135deg, #ff0844, #ffb199, #ff0844)' :
                                  scene.bgStyle === 'mood_calm' ? 'linear-gradient(135deg, #0c1445, #1a237e, #0d1b3e)' :
                                  scene.bgStyle === 'mood_cute' ? 'linear-gradient(135deg, #ff9a9e, #fecfef, #ffdde1)' :
                                  scene.bgStyle === 'mood_serious' ? 'linear-gradient(135deg, #1a1a2e, #2d2d44, #16213e)' :
                                  '#000'
                              }}>
                                <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100%',color:'white',fontSize:12,fontWeight:'bold',textShadow:'0 1px 4px rgba(0,0,0,0.8)'}}>プレビュー</div>
                              </div>
                              <p className="text-xs text-purple-600">画像なしでテキストの雰囲気に合った背景スタイルを適用します</p>
                            </div>
                          )}

                          {scene.imageSource === 'ai' && (
                            <p className="text-xs text-blue-600 mt-1">Stable Diffusion (Forge) がタグベースで画像を生成します</p>
                          )}
                          {scene.imageSource === 'none' && (
                            <p className="text-xs text-gray-500 mt-1">単色黒背景のみで表示されます</p>
                          )}
                        </div>

                        <div className="col-span-1 md:col-span-2">
                          <label className="block text-sm font-bold mb-2 text-gray-700">
                            備考・指示メモ（※最高位の命令）
                            <span className="text-gray-400 font-normal ml-2 text-xs">（例: 「読み上げ: こんにちは」でナレーション強制変更 / 「4秒静止」でテンポ無視）</span>
                          </label>
                          <textarea
                            value={scene.sceneNote}
                            onChange={(e) => updateScene(scene.id, 'sceneNote', e.target.value)}
                            placeholder="ここに書かれた指示は、全体のテンポ設定やテキストルールなど【すべてのルールよりも優先】して絶対的に適用されます。画像生成の細かい指示もここに記述してください。"
                            className="w-full border-2 border-red-200 rounded-lg p-3 h-16 bg-red-50 focus:border-red-400 focus:outline-none transition-colors resize-none text-sm font-bold text-gray-700"
                          />
                        </div>
                      </div>
                    </div>
                  )})}

                  <button
                    onClick={addScene}
                    className="w-full border-2 border-dashed border-gray-300 text-gray-600 font-bold py-4 rounded-xl hover:bg-gray-100 hover:border-gray-400 transition-all flex items-center justify-center"
                  >
                    <span className="text-2xl mr-2">+</span> シーンを追加する
                  </button>
                </div>
              </section>
            )}

            {/* --- 3. エクスポート --- */}
            <section className="text-center mt-12 pb-8">
              <button
                onClick={handleExport}
                className="bg-gradient-to-r from-blue-600 to-indigo-700 text-white font-extrabold py-5 px-16 rounded-full shadow-xl hover:shadow-2xl hover:from-blue-700 hover:to-indigo-800 transform hover:scale-105 transition-all text-xl inline-flex items-center justify-center"
              >
                <span className="mr-3">⚡️</span> AIへ指示を出す (JSON保存)
              </button>
              <p className="text-gray-500 mt-4 text-sm">設定に基づいた詳細なプロンプトを含むJSONファイルがダウンロードされます。</p>
            </section>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
